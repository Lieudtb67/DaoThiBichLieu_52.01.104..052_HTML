    <p><i>Thơ thẩn đường chiểu một khúc thơ,</br>
        Say nhìn xa rặng núi xanh lơ,</i></br>
        Khi trời lặng lẽ và trong trẻo;</br>
        Thấp thoáng rừng mơ,<b>Cô hái mơ.</b></br></p>
